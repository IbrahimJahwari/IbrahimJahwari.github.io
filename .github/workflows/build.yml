name: build

# Turns the raw collector files on the data branch into the small processed files the charts read.
# Runs once a day, and by hand from the Actions tab (Run workflow).
on:
  schedule:
    - cron: "40 0 * * *"   # just after midnight UTC
  workflow_dispatch:

concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_DIR: ${{ github.workspace }}/data-branch
      REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-build.txt

      - run: pip install -r pipeline/requirements-build.txt

      - name: Check out the data branch
        run: bash pipeline/ci/prepare_data_branch.sh data-branch

      - name: Build processed files
        run: python pipeline/build.py

      - name: Commit to the data branch
        if: always()
        run: |
          bash pipeline/ci/commit_data.sh data-branch "build $(date -u +%Y-%m-%d)"
