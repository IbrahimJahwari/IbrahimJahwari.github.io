name: reference

on:
  schedule:
    - cron: "17 3 1 * *"   # monthly
  workflow_dispatch:

concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_DIR: ${{ github.workspace }}/data-branch
      REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Check out the data branch
        run: bash pipeline/ci/prepare_data_branch.sh data-branch

      - name: Build reference tables
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: python pipeline/build_reference.py

      - name: Commit to the data branch
        if: always()
        run: |
          bash pipeline/ci/commit_data.sh data-branch "reference $(date -u +%Y-%m-%d)"
