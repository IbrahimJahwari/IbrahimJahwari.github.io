name: collect

on:
  schedule:
    # every 15 minutes, off the top of the hour (GitHub delays jobs at :00)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_DIR: ${{ github.workspace }}/data-branch
      REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Check out the data branch
        run: bash pipeline/ci/prepare_data_branch.sh data-branch

      - name: Collect snapshot
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: python pipeline/collect.py

      - name: Build status file
        if: always()
        run: python pipeline/process.py

      - name: Commit to the data branch
        if: always()
        run: |
          bash pipeline/ci/commit_data.sh data-branch "data $(date -u +%Y-%m-%dT%H:%MZ)"
